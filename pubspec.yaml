name: intrst
description: the intrst app

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.3+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  flutter_app_badger: ^1.5.0
  restart_app: ^1.8.3
  english_words: ^4.0.0
  provider: ^6.1.2
  font_awesome_flutter: ^11.0.0
  flutter_login: ^7.0.0
  firebase_auth: ^5.6.0
  firebase_core: ^3.13.0
  cloud_firestore: ^5.6.0
  google_maps_flutter: ^2.14.2
  geolocator: ^12.0.0
  label_marker: ^1.0.1
  location: ^8.0.1
  http: ^1.2.2
  uuid: ^4.5.1
  animated_toggle_switch: ^0.8.4
  google_maps_flutter_web: ^0.5.14+3
  firebase_messaging: ^15.2.5
  shared_preferences: ^2.5.3
  go_router: ^17.3.0
  cloud_functions: ^5.6.2
  # In-memory Firestore used to seed data for the Patrol scenarios in lib/qa/.
  # It is a regular dependency (not dev-only) because those scenarios are also
  # replayed live by the admin dashboard, which is app code. Both the dashboard
  # and its drawer entry are gated on `kIsWeb && kDebugMode` — compile-time
  # constants — so release builds tree-shake the dashboard, the scenarios and
  # this package away.
  fake_cloud_firestore: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Patrol finder framework (https://patrol.leancode.co/) — provides the `$`
  # finder API and `patrolWidgetTest`, which run under `flutter test`.
  patrol_finders: ^2.9.0
  # Generates the per-platform launcher icons from assets/app_icon.png.
  # Run `dart run flutter_launcher_icons` after changing that source image.
  flutter_launcher_icons: ^0.14.4

# Every platform icon is downsampled from the single 1024x1024 source below.
# Do not point this at assets/favicon.png -- that file is 32x32 and upscaling it
# is what made the icons look bitmapped.
flutter_launcher_icons:
  image_path: "assets/app_icon.png"
  ios: true
  android: true
  macos:
    generate: true
  web:
    generate: true
  # iOS rejects icons with an alpha channel. The source is white artwork on a
  # dark field, so flatten it onto black rather than the default white.
  remove_alpha_ios: true
  background_color_ios: "#000000"
flutter:
  uses-material-design: true
  assets:
    - assets/