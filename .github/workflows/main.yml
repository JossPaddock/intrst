on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Run flutter version to check if we have flutter
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # Runs the full suite and prints the formatted report
      # (Test <name> passed ✅ / failed ❌, phase breakdown for any failures,
      # and a Passed X/Y tally). A non-zero exit here fails the job and blocks
      # the build/deploy steps below. This is the same command developers run
      # locally via ./scripts/run_tests.sh.
      - name: Run test suite (Patrol)
        run: bash scripts/run_tests.sh

      - name: Build Flutter Web App
        run: flutter build web

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Deploy static site to S3 bucket
        run: aws s3 sync build/web/ s3://intrst --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
